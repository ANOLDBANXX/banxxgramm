<!-- TOP NAVBAR -->
  <header class="top-navbar">
    <div class="brand-container nav-item" data-page="home-page" style="cursor: pointer; display: flex; align-items: center;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" style="height: 38px; width: auto;">
        <defs>
          <linearGradient id="g" x1="0" x2="1">
            <stop stop-color="#087cff"/>
            <stop offset=".58" stop-color="#18a0ff"/>
            <stop offset="1" stop-color="#ff7a00"/>
          </linearGradient>
        </defs>
        <rect width="800" height="240" rx="45" fill="#05070d"/>
        <rect x="28" y="28" width="184" height="184" rx="48" fill="url(#g)"/>
        <rect x="55" y="55" width="130" height="130" rx="36" fill="#05070d"/>
        <circle cx="120" cy="120" r="42" fill="none" stroke="#087cff" stroke-width="16"/>
        <circle cx="158" cy="82" r="9" fill="#ff7a00"/>
        <text x="240" y="150" font-family="Arial,Segoe UI,sans-serif" font-size="92" font-weight="900" fill="#18a0ff">Banxx</text>
        <text x="510" y="150" font-family="Arial,Segoe UI,sans-serif" font-size="92" font-weight="900" fill="#ff7a00">gram</text>
      </svg>
    </div>

    <div class="nav-search-bar">
      <span class="search-icon-inside">🔍</span>
      <input type="text" id="searchInput" placeholder="Search users, posts or hashtags...">
    </div>

    <div class="top-nav-actions">
      <button class="top-nav-btn active nav-item" data-page="home-page">🏠 Home</button>
      <button class="top-nav-btn nav-item" data-page="search-page">🔍 Search</button>
      <button class="top-nav-btn" id="openCreatePostBtn">+ Create</button>
      <button class="top-nav-btn nav-item" data-page="profile-page">👤 Profile</button>
      <button class="top-nav-btn btn-sign-in" id="switchAccountBtn">Sign In</button>
      <button class="top-nav-btn btn-sign-up" id="logoutBtn">Sign Up</button>
    </div>
  </header>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banxxgram</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
       1. GLOBAL STYLES & CSS VARIABLES
       ========================================== */
    :root {
      --panel-bg: #0b172a;
      --panel-border: #1e293b;
      --accent-orange: #ff6b00;
      --accent-blue: #0052cc;
      --pill-bg: #1e293b;
      --text-muted: #94a3b8;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* TOP NAVBAR */
    .top-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      font-size: 1.5rem;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(45deg, var(--accent-orange), #ff9900);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-search-bar {
      display: flex;
      align-items: center;
      background: #061022;
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: 20px;
      width: 320px;
    }

    .nav-search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      margin-left: 8px;
      width: 100%;
    }

    .top-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .top-nav-btn:hover, .top-nav-btn.active {
      color: #fff;
      background: var(--panel-border);
    }

    .btn-sign-in { background: var(--panel-border); color: #fff; }
    .btn-sign-up { background: var(--accent-orange); color: #fff; }

    /* LAYOUT CONTAINER */
    .app-container {
      display: grid;
      grid-template-columns: 240px 1fr 300px;
      gap: 24px;
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    /* LEFT SIDEBAR */
    .left-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .user-profile-summary {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 20px;
      border-radius: var(--radius-lg);
    }

    .sidebar-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    .sidebar-btn:hover, .sidebar-btn.active {
      background: var(--panel-bg);
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 15px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* MAIN FEED AREA */
    .main-feed-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page { display: none; }
    .page.active { display: flex; flex-direction: column; gap: 20px; }

    /* STORIES TRAY */
    .stories-container {
      display: flex;
      gap: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      overflow-x: auto;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .story-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent-orange), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .story-ring.add-story {
      background: var(--pill-bg);
      border: 2px dashed var(--accent-orange);
      font-size: 1.2rem;
    }

    .story-item small {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* CREATE POST CARD */
    .create-post-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .create-post-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .create-post-top input {
      flex: 1;
      background: #061022;
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 20px;
      color: #fff;
      outline: none;
    }

    .create-post-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--panel-border);
      padding-top: 10px;
    }

    .attach-media-options {
      display: flex;
      gap: 15px;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-orange-post {
      background: var(--accent-orange);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* FEED POST CARD */
    .feed-post-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post-author-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .author-names {
      display: flex;
      flex-direction: column;
    }

    .author-names small {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .post-caption-text {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .media-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .post-image-preview {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      display: block;
    }

    .post-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      font-size: 0.9rem;
    }

    .left-actions {
      display: flex;
      gap: 16px;
    }

    .action-item {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      transition: all 0.15s ease-in-out;
    }

    .action-item.liked {
      color: #ff3366 !important;
      transform: scale(1.05);
    }

    /* HEART POP ANIMATION ON DOUBLE TAP */
    .heart-pop {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 4rem;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .heart-pop.pop {
      animation: heartAnimation 0.8s forwards;
    }

    @keyframes heartAnimation {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* AVATARS */
    .avatar-orange-gradient {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-orange), #ff9900);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* RIGHT SIDEBAR */
    .right-sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .widget-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .widget-title {
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .suggested-users-list, .trending-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggested-user-item, .trending-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trending-item {
      cursor: pointer;
    }

    .trending-tag { font-weight: bold; font-size: 0.9rem; }
    .trending-count { font-size: 0.75rem; color: var(--text-muted); }

    .btn-follow-outline {
      background: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    /* MODAL SYSTEM */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal.hidden { display: none; }

    .modal-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 440px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px; right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group textarea {
      background: #061022;
      border: 1px solid var(--panel-border);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: var(--accent-orange);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header class="top-navbar">
    <div class="brand-container">
      <div class="brand-logo-icon">📷</div>

  <div class="app-container">

    <aside class="left-sidebar">

        </button>
      </nav>

      <div class="sidebar-footer">
        <strong>BANXXGRAM</strong>
        <p>Share • Connect • Be You.</p>
      </div>
    </aside>

    <!-- MAIN FEED AREA -->
    <main class="main-feed-area">
      
      <!-- HOME PAGE -->
      <section id="home-page" class="page active">
        
        <!-- STORIES TRAY -->
        <div class="stories-container">
          <div class="

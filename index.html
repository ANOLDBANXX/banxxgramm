<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banxxgram</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="logo">Banxxgram</h1>
    </div>
    <div class="header-center">
      <input type="text" id="globalSearch" placeholder="Search..." />
    </div>
    <div class="header-right">
      <button id="headerSignInBtn" class="btn secondary">Sign In</button>
      <button id="headerSignUpBtn" class="btn primary">Sign Up</button>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <div class="app-container">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar">
      <div class="user-profile-summary">
        <div class="avatar" id="sideAvatar">GU</div>
        <div class="user-details">
          <strong id="sideDisplayName">Guest User</strong>
          <small id="sideUsername">@guest</small>
        </div>
      </div>
      <nav class="nav-menu">
        <button data-section="home" class="nav-btn active">🏠 Home</button>
        <button data-section="search" class="nav-btn">🔍 Search</button>
        <button data-section="create" class="nav-btn">➕ Create Post</button>
        <button data-section="profile" class="nav-btn">👤 Profile</button>
      </nav>
    </aside>

    <!-- CONTENT PAGES -->
    <main class="main-content">
      <!-- HOME PAGE -->
      <section id="home" class="page active">
        <div id="stories" class="stories-bar"></div>
        <div id="feed" class="feed-container"></div>
      </section>

      <!-- SEARCH PAGE -->
      <section id="search" class="page">
        <div class="card page-card">
          <h2>Search Accounts</h2>
          <input type="text" id="searchInput" placeholder="Search by username..." />
          <div id="results" class="results empty">Start typing to search.</div>
        </div>
      </section>

      <!-- CREATE POST PAGE -->
      <section id="create" class="page">
        <div class="card page-card">
          <h2>Create New Post</h2>
          <textarea id="postText" placeholder="What's on your mind?" rows="4"></textarea>
          <div class="file-input-wrapper">
            <input type="file" id="postImage" accept="image/*,video/*" />
            <div id="imagePreview" class="image-preview">No file selected</div>
          </div>
          <button id="publishBtn" class="btn primary full-width">Publish Post</button>
        </div>
      </section>

      <!-- PROFILE PAGE -->
      <section id="profile" class="page">
        <div class="card page-card profile-header-card">
          <div class="profile-main">
            <div class="avatar xl" id="profileAvatar">GU</div>
            <div>
              <h2 id="profileUsername">@guest</h2>
              <p id="profileBio" class="muted">No bio added yet.</p>
            </div>
          </div>
          <div class="profile-stats">
            <div><strong id="postCount">0</strong><span>Posts</span></div>
            <div><strong id="followerCount">0</strong><span>Followers</span></div>
            <div><strong id="followingCount">0</strong><span>Following</span></div>
          </div>
        </div>
        <h3>Your Posts</h3>
        <div id="profileGrid" class="profile-grid"></div>
      </section>
    </main>

    <!-- RIGHT SIDEBAR (SUGGESTIONS) -->
    <aside class="right-sidebar">
      <h3>Suggested for you</h3>
      <div id="suggestions" class="suggestions-list"></div>
    </aside>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content card">
      <span id="closeAuthModal" class="close-btn">&times;</span>
      <h2>Sign In / Register</h2>
      <div class="form-group">
        <input type="email" id="authEmail" placeholder="Email address" />
        <input type="password" id="authPassword" placeholder="Password" />
        <button id="modalSignInBtn" class="btn primary full-width">Sign In</button>
      </div>
      <hr />
      <p class="muted small">Or switch to a demo profile:</p>
      <div class="chip-group">
        <button class="chip" data-user="anold">@anold.banxx</button>
        <button class="chip" data-user="sarah">@sarah.styles</button>
        <button class="chip" data-user="john">@john.daily</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
